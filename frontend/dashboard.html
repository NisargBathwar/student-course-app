<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body { font-family: Arial; padding: 20px; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
button { padding: 6px 12px; cursor: pointer; }
.enrolled { background-color: #d4edda; }
</style>

</head>
<body>

<h2>Student Dashboard</h2>

<button onclick="logout()">Logout</button>

<h3>Courses</h3>

<table>
<thead>
<tr>
<th>Course</th>
<th>Description</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="courseTable"></tbody>
</table>

<script>

// STATIC COURSES (no backend needed)
const courses = [
    { id: "1", title: "Web Development", description: "HTML, CSS, JS" },
    { id: "2", title: "Node.js", description: "Backend Development" },
    { id: "3", title: "Database", description: "MongoDB Basics" }
];

// Load enrolled courses from localStorage
let enrolledCourses = JSON.parse(localStorage.getItem("enrolledCourses")) || [];

// Load table
function loadCourses() {
    const table = document.getElementById("courseTable");
    table.innerHTML = "";

    courses.forEach(course => {
        const isEnrolled = enrolledCourses.includes(course.id);

        const status = isEnrolled ? "Enrolled" : "Not Enrolled";

        const button = isEnrolled
            ? `<button onclick="removeEnroll('${course.id}')">Remove</button>`
            : `<button onclick="enroll('${course.id}')">Enroll</button>`;

        const row = `
            <tr class="${isEnrolled ? 'enrolled' : ''}">
                <td>${course.title}</td>
                <td>${course.description}</td>
                <td>${status}</td>
                <td>${button}</td>
            </tr>
        `;

        table.innerHTML += row;
    });
}

// Enroll
function enroll(courseId) {
    enrolledCourses.push(courseId);
    localStorage.setItem("enrolledCourses", JSON.stringify(enrolledCourses));

    alert("✅ Enrolled Successfully");
    loadCourses();
}

// Remove enrollment
function removeEnroll(courseId) {
    enrolledCourses = enrolledCourses.filter(id => id !== courseId);
    localStorage.setItem("enrolledCourses", JSON.stringify(enrolledCourses));

    alert("❌ Enrollment Removed");
    loadCourses();
}

// Logout
function logout() {
    localStorage.removeItem("enrolledCourses");
    window.location.href = "login.html";
}

// Initial load
loadCourses();

</script>

</body>
</html>
